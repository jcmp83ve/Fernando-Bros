<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fernando Bros</title>
<style>
  html,body{margin:0;padding:0;background:#111;height:100%;overflow:hidden;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column}
  canvas{background:#5c94fc;max-width:100vw;max-height:100vh;
    box-shadow:0 0 40px #000;touch-action:none}
  /* ---- controles en pantalla: cruceta a la izquierda, acción a la derecha ----
     Cada botón es una zona de toque GRANDE e invisible (.tbtn) con un círculo
     visible más pequeño dentro (.tbtn i). Así se ve discreto pero es facilísimo
     de acertar, incluso con el dedo de un niño y sin mirar. */
  .tbtn{position:fixed;display:none;align-items:center;justify-content:center;
    z-index:10;touch-action:none;background:none;border:0;padding:0;
    --d:min(80px, 17vmin);          /* círculo visible */
    --pad:min(22px, 4.5vmin);       /* margen invisible extra de toque */
    width:calc(var(--d) + var(--pad) * 2);
    height:calc(var(--d) + var(--pad) * 2);
    /* márgenes seguros del teléfono (notch y barra de inicio) */
    --sx:calc(14px + env(safe-area-inset-left));
    --sy:calc(14px + env(safe-area-inset-bottom));
    --sr:calc(14px + env(safe-area-inset-right));
  }
  .tbtn i{display:flex;align-items:center;justify-content:center;
    width:var(--d);height:var(--d);border-radius:50%;font-style:normal;
    background:rgba(255,255,255,.24);border:2px solid rgba(255,255,255,.6);
    color:#fff;font-weight:bold;font-size:calc(var(--d)*.38);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 2px 12px rgba(0,0,0,.4);
    transition:transform .06s ease, background .06s ease;
    pointer-events:none}
  .tbtn.on i{transform:scale(1.08);background:rgba(255,255,255,.5)}
  @media (pointer:coarse){ .tbtn{display:flex} }
  body.conMando .tbtn{display:none !important}   /* con mando conectado estorban */
  /* en los menús y en la sala arcade todo se elige tocando la pantalla:
     los botones sobran y además tapaban la última fila de tarjetas */
  body.sinBotones .tbtn{display:none !important}

  /* cruceta en diamante, abajo a la izquierda (las posiciones descuentan el
     margen invisible para que el círculo quede donde siempre) */
  #bL   {left:calc(var(--sx) - var(--pad));                    bottom:calc(var(--sy) + var(--d) - var(--pad))}
  #bR   {left:calc(var(--sx) + var(--d) * 2 - var(--pad));     bottom:calc(var(--sy) + var(--d) - var(--pad))}
  #bUp  {left:calc(var(--sx) + var(--d) - var(--pad));         bottom:calc(var(--sy) + var(--d) * 2 - var(--pad))}
  #bDown{left:calc(var(--sx) + var(--d) - var(--pad));         bottom:calc(var(--sy) - var(--pad))}

  /* botones de acción en diagonal, como un mando de verdad */
  #bA{right:calc(var(--sr) - var(--pad));                      bottom:calc(var(--sy) + var(--d) * .8 - var(--pad))}
  #bB{right:calc(var(--sr) + var(--d) * 1.15 - var(--pad));    bottom:calc(var(--sy) - var(--pad))}
  #bA i{background:rgba(255,120,90,.34);border-color:rgba(255,180,160,.8)}
  #bB i{background:rgba(120,170,255,.34);border-color:rgba(175,205,255,.8)}
  #bA.on i{background:rgba(255,120,90,.62)}
  #bB.on i{background:rgba(120,170,255,.62)}

  /* teléfono acostado: botones algo menores y pegados abajo, para no tapar la acción */
  @media (pointer:coarse) and (max-height:460px){
    .tbtn{--d:min(62px, 15.5vmin); --pad:min(18px, 4vmin);
          --sy:calc(10px + env(safe-area-inset-bottom))}
  }
  /* pantallas muy bajas: aún más discretos */
  @media (pointer:coarse) and (max-height:360px){ .tbtn{--d:min(52px, 14vmin); --pad:14px} }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="tbtn" id="bL"><i>◀</i></div><div class="tbtn" id="bR"><i>▶</i></div>
<div class="tbtn" id="bUp"><i>▲</i></div><div class="tbtn" id="bDown"><i>▼</i></div>
<div class="tbtn" id="bB"><i>B</i></div><div class="tbtn" id="bA"><i>A</i></div>
<script>
/* Carga el juego con una marca de tiempo única: así el navegador nunca
   sirve una versión guardada vieja aunque tenga el index.html en caché. */
(function(){
  var t = Date.now();
  var s = document.createElement('script');
  s.src = 'game.js?t=' + t;
  s.onerror = function(){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#fff;text-align:center;font-family:monospace">No se pudo cargar el juego. Revisa tu conexión y recarga.</p>');
  };
  s.onload = function(){
    var m = document.createElement('script');
    m.src = 'minijuegos.js?t=' + t;
    document.body.appendChild(m);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
