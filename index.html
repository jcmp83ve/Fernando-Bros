<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fernando Bros</title>
<style>
  html,body{margin:0;padding:0;background:#111;height:100%;overflow:hidden;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column}
  canvas{background:#5c94fc;max-width:100vw;max-height:100vh;
    box-shadow:0 0 40px #000;touch-action:none}
  .tbtn{touch-action:none}
  /* ---- controles en pantalla: cruceta a la izquierda, acción a la derecha ---- */
  .tbtn{position:fixed;border-radius:50%;
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);
    color:#fff;font-weight:bold;display:none;align-items:center;justify-content:center;
    z-index:10;touch-action:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    transition:transform .06s ease, background .06s ease;
    --d:min(66px, 14vmin);
    width:var(--d);height:var(--d);font-size:calc(var(--d)*.36);
    /* márgenes seguros del teléfono (notch y barra de inicio) */
    --sx:calc(14px + env(safe-area-inset-left));
    --sy:calc(14px + env(safe-area-inset-bottom));
    --sr:calc(14px + env(safe-area-inset-right));
  }
  .tbtn:active{transform:scale(.9);background:rgba(255,255,255,.42)}
  @media (pointer:coarse){ .tbtn{display:flex} }
  body.conMando .tbtn{display:none !important}   /* con mando conectado estorban */

  /* cruceta en diamante, abajo a la izquierda */
  #bL   {left:var(--sx);                              bottom:calc(var(--sy) + var(--d))}
  #bR   {left:calc(var(--sx) + var(--d) * 2);         bottom:calc(var(--sy) + var(--d))}
  #bUp  {left:calc(var(--sx) + var(--d));             bottom:calc(var(--sy) + var(--d) * 2)}
  #bDown{left:calc(var(--sx) + var(--d));             bottom:var(--sy)}

  /* botones de acción en diagonal, como un mando de verdad */
  #bA{right:var(--sr);                                bottom:calc(var(--sy) + var(--d) * .75);
      background:rgba(255,120,90,.30);border-color:rgba(255,170,150,.75)}
  #bB{right:calc(var(--sr) + var(--d) * 1.1);         bottom:var(--sy);
      background:rgba(120,170,255,.30);border-color:rgba(170,200,255,.75)}
  #bA:active{background:rgba(255,120,90,.55)}
  #bB:active{background:rgba(120,170,255,.55)}

  /* en pantallas anchas y bajas (teléfono acostado) los botones se hacen algo menores */
  /* teléfono acostado: botones menores y pegados abajo, para no tapar la acción */
  @media (pointer:coarse) and (max-height:460px){
    .tbtn{--d:min(52px, 13.5vmin); --sy:calc(10px + env(safe-area-inset-bottom))}
  }
  /* pantallas muy bajas: aún más discretos */
  @media (pointer:coarse) and (max-height:360px){ .tbtn{--d:min(46px, 13vmin)} }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="tbtn" id="bL">◀</div><div class="tbtn" id="bR">▶</div>
<div class="tbtn" id="bUp">▲</div><div class="tbtn" id="bDown">▼</div>
<div class="tbtn" id="bB">B</div><div class="tbtn" id="bA">A</div>
<script>
/* Carga el juego con una marca de tiempo única: así el navegador nunca
   sirve una versión guardada vieja aunque tenga el index.html en caché. */
(function(){
  var t = Date.now();
  var s = document.createElement('script');
  s.src = 'game.js?t=' + t;
  s.onerror = function(){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#fff;text-align:center;font-family:monospace">No se pudo cargar el juego. Revisa tu conexión y recarga.</p>');
  };
  s.onload = function(){
    var m = document.createElement('script');
    m.src = 'minijuegos.js?t=' + t;
    document.body.appendChild(m);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
