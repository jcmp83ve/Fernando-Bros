<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fernando Bros</title>
<style>
  html,body{margin:0;padding:0;background:#111;height:100%;overflow:hidden;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column}
  canvas{background:#5c94fc;max-width:100vw;max-height:100vh;
    box-shadow:0 0 40px #000;touch-action:none}
  .tbtn{touch-action:none}
  .tbtn{position:fixed;bottom:18px;width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);
    color:#fff;font-size:22px;font-weight:bold;display:none;align-items:center;justify-content:center;
    z-index:10}
  @media (pointer:coarse){ .tbtn{display:flex} }
  #bL{left:16px} #bR{left:92px} #bDown{left:54px;bottom:92px;width:56px;height:56px}
  #bB{right:96px} #bA{right:16px;bottom:44px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="tbtn" id="bL">◀</div><div class="tbtn" id="bR">▶</div><div class="tbtn" id="bDown">▼</div>
<div class="tbtn" id="bB">B</div><div class="tbtn" id="bA">A</div>
<script>
/* Carga el juego con una marca de tiempo única: así el navegador nunca
   sirve una versión guardada vieja aunque tenga el index.html en caché. */
(function(){
  var s = document.createElement('script');
  s.src = 'game.js?t=' + Date.now();
  s.onerror = function(){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#fff;text-align:center;font-family:monospace">No se pudo cargar el juego. Revisa tu conexión y recarga.</p>');
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
