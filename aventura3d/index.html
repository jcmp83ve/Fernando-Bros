<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fernando y Tío Juan: La Gran Aventura</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Luckiest+Guy&display=swap">
<style>
  html,body{margin:0;padding:0;background:#0b3d6e;height:100%;overflow:hidden;
    font-family:'Fredoka','Trebuchet MS',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;left:0;top:0;touch-action:none}
  #gl{z-index:1;background:#62b8ff}
  #hud{z-index:2}
  #cargando{position:fixed;z-index:3;left:0;right:0;top:44%;text-align:center;color:#fff;font-size:22px;
    text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
  #cargando small{display:block;font-size:14px;opacity:.8;margin-top:8px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="cargando">🌴 Armando la isla de Fernando…<small>carro · moto · barco · avión · submarino · y el Señor Popo</small></div>
<script>
/* El motor 3D (Three.js, licencia MIT) es el mismo de Pichungito Kart, que
   vive en la carpeta de al lado; el juego se carga con una marca de tiempo
   para que nunca sirva una versión vieja guardada en caché. */
(function(){
  var t = Date.now();
  var s = document.createElement('script');
  s.src = '../kart3d/three.min.js';
  s.onload = function(){
    var g = document.createElement('script');
    g.src = 'aventura3d.js?t=' + t;
    g.onload = function(){ var c = document.getElementById('cargando'); if (c) c.remove(); };
    g.onerror = function(){ aviso('No se pudo cargar el juego. Revisa tu conexión y recarga.'); };
    document.body.appendChild(g);
  };
  s.onerror = function(){ aviso('No se pudo cargar el motor 3D. Revisa tu conexión y recarga.'); };
  function aviso(m){ var c = document.getElementById('cargando'); if (c) c.textContent = m; }
  document.body.appendChild(s);
})();
</script>
</body>
</html>
