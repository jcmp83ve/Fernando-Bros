<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>El Dominó de Tía Yany</title>
<style>
  html,body{margin:0;padding:0;background:#06180f;height:100%;overflow:hidden;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{background:#12703f;max-width:100vw;max-height:100vh;box-shadow:0 0 40px #000;touch-action:none}
  /* Botones grandes para el celular: la zona que se toca es bastante mayor
     que el círculo que se ve, para acertar sin mirar. */
  .tbtn{position:fixed;display:none;align-items:center;justify-content:center;
    z-index:10;touch-action:none;background:none;border:0;padding:0;
    --d:min(76px, 16vmin); --pad:min(20px, 4.5vmin);
    width:calc(var(--d) + var(--pad) * 2); height:calc(var(--d) + var(--pad) * 2);
    --sx:calc(14px + env(safe-area-inset-left));
    --sy:calc(14px + env(safe-area-inset-bottom));
    --sr:calc(14px + env(safe-area-inset-right))}
  .tbtn i{display:flex;align-items:center;justify-content:center;
    width:var(--d);height:var(--d);border-radius:50%;font-style:normal;
    background:rgba(255,255,255,.24);border:2px solid rgba(255,255,255,.6);
    color:#fff;font-weight:bold;font-size:calc(var(--d)*.36);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 2px 12px rgba(0,0,0,.4);transition:transform .06s ease, background .06s ease;
    pointer-events:none}
  .tbtn.on i{transform:scale(1.08);background:rgba(255,255,255,.5)}
  @media (pointer:coarse){ .tbtn{display:flex} }
  body.sinBotones .tbtn{display:none !important}
  #bL{left:calc(var(--sx) - var(--pad));                   bottom:calc(var(--sy) - var(--pad))}
  #bR{left:calc(var(--sx) + var(--d) * 1.3 - var(--pad));  bottom:calc(var(--sy) - var(--pad))}
  #bA{right:calc(var(--sr) - var(--pad));                  bottom:calc(var(--sy) - var(--pad))}
  #bB{right:calc(var(--sr) + var(--d) * 1.3 - var(--pad)); bottom:calc(var(--sy) - var(--pad))}
  #bA i{background:rgba(255,120,90,.34);border-color:rgba(255,180,160,.8)}
  #bB i{background:rgba(120,170,255,.34);border-color:rgba(175,205,255,.8)}
  @media (pointer:coarse) and (max-height:460px){
    .tbtn{--d:min(58px, 14.5vmin); --pad:min(16px, 4vmin);
          --sy:calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="tbtn" id="bL"><i>◀</i></div><div class="tbtn" id="bR"><i>▶</i></div>
<div class="tbtn" id="bB"><i>✕</i></div><div class="tbtn" id="bA"><i>A</i></div>
<script>
/* Se carga con una marca de tiempo para que el navegador nunca sirva una
   versión vieja guardada en caché. */
(function(){
  var s = document.createElement('script');
  s.src = 'domino.js?t=' + Date.now();
  s.onerror = function(){
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:#fff;text-align:center;font-family:monospace">No se pudo cargar el juego. Revisa tu conexión y recarga.</p>');
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
