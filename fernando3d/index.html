<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fernando 3D</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;padding:0;background:#0a0620;height:100%;overflow:hidden;
    font-family:'Fredoka','Trebuchet MS',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-touch-callout:none}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;left:0;top:0;touch-action:none}
  #gl{z-index:1;background:#7cc8ff}
  #hud{z-index:2}
  #cargando{position:fixed;z-index:3;left:0;right:0;top:40%;text-align:center;color:#ffd23f;font-size:34px;font-weight:700;
    text-shadow:0 3px 10px rgba(0,0,0,.6);pointer-events:none}
  #cargando small{display:block;font-size:16px;color:#fff;opacity:.85;margin-top:10px;font-weight:400}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="cargando">⭐ Fernando 3D ⭐<small>Tío Juan está preparando el castillo…</small></div>
<script>
/* El motor 3D (Three.js, MIT) es el mismo de Pichungito Kart. Se carga en orden
   y con una marca de tiempo para no usar versiones viejas guardadas. */
(function(){
  var t = Date.now();
  var lista = ['../kart3d/three.min.js', 'nucleo.js', 'modelos.js', 'vista.js'];
  function aviso(m){ var c = document.getElementById('cargando'); if (c){ c.style.display = 'block'; c.innerHTML = m; } }
  window.addEventListener('error', function(e){ aviso('¡Uy! Algo falló al cargar.<small>' + (e.message || '') + '</small>'); });
  function siguiente(i){
    if (i >= lista.length) return;
    var s = document.createElement('script');
    s.src = lista[i] + (lista[i].indexOf('three.min') >= 0 ? '' : '?t=' + t);
    s.onload = function(){ siguiente(i + 1); };
    s.onerror = function(){ aviso('No se pudo cargar el juego (' + lista[i] + ').<small>Revisa tu conexión y recarga.</small>'); };
    document.body.appendChild(s);
  }
  siguiente(0);
})();
</script>
</body>
</html>
